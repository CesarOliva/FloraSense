<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAM 2 demo</title>
  <style>
    body { margin: 0; background: #fff; color: #111; font-family: system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.hint { color: #666; margin: 0 0 16px; font-size: .9rem; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    button, label.btn { border: 1px solid #ccc; background: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    button:hover, label.btn:hover { background: #f4f4f4; }
    button:disabled { opacity: .5; cursor: default; }
    input[type=file] { display: none; }
    #status { color: #555; font-size: .85rem; }
    #stage { position: relative; display: inline-block; max-width: 100%; border: 1px dashed #ccc; min-height: 200px; min-width: 100%; }
    #stage.has-img { border-color: transparent; min-height: 0; min-width: 0; }
    #stage img { display: block; max-width: 100%; height: auto; user-select: none; }
    #mask { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #999; }
    .pt { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; box-shadow: 0 0 2px #000; }
    .pt.pos { background: #16a34a; }
    .pt.neg { background: #dc2626; }
  </style>
</head>
<body>
<main>
  <h1>SAM 2 — demo de segmentación</h1>
  <p class="hint">Sube una foto y haz <b>clic izquierdo</b> sobre el objeto (incluir) o <b>clic derecho</b> para excluir zonas.</p>

  <div class="bar">
    <label class="btn">Adjuntar foto <input id="file" type="file" accept="image/*" /></label>
    <button id="undo" disabled>Deshacer punto</button>
    <button id="clear" disabled>Limpiar</button>
    <span id="status">Cargando…</span>
  </div>

  <div id="stage">
    <div id="empty">Ninguna imagen cargada</div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), status = $("status");
  let imageId = null, imgW = 0, imgH = 0, points = [], img = null, maskImg = null;

  fetch("/info").then(r => r.json())
    .then(i => status.textContent = `Modelo: ${i.model} (${i.device})`)
    .catch(() => status.textContent = "Servidor no disponible");

  $("file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    reset();
    stage.innerHTML = "";
    img = new Image();
    img.src = URL.createObjectURL(file);
    stage.appendChild(img);
    stage.classList.add("has-img");
    maskImg = document.createElement("img");
    maskImg.id = "mask";
    maskImg.hidden = true;
    stage.appendChild(maskImg);

    status.textContent = "Calculando embeddings de la imagen…";
    const fd = new FormData();
    fd.append("file", file);
    try {
      const r = await fetch("/upload", { method: "POST", body: fd });
      if (!r.ok) throw new Error((await r.json()).detail);
      const d = await r.json();
      imageId = d.image_id; imgW = d.width; imgH = d.height;
      status.textContent = `Listo (${d.embedding_seconds}s). Haz clic sobre un objeto.`;
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
    e.target.value = "";
  });

  stage.addEventListener("contextmenu", (e) => e.preventDefault());
  stage.addEventListener("mousedown", (e) => {
    if (!imageId || e.target !== img || (e.button !== 0 && e.button !== 2)) return;
    const rect = img.getBoundingClientRect();
    const fx = (e.clientX - rect.left) / rect.width;
    const fy = (e.clientY - rect.top) / rect.height;
    points.push({ x: fx * imgW, y: fy * imgH, label: e.button === 0 ? 1 : 0, fx, fy });
    run();
  });

  $("undo").onclick = () => { points.pop(); run(); };
  $("clear").onclick = () => { points = []; run(); };

  function drawPoints() {
    stage.querySelectorAll(".pt").forEach(n => n.remove());
    for (const p of points) {
      const d = document.createElement("div");
      d.className = "pt " + (p.label ? "pos" : "neg");
      d.style.left = p.fx * 100 + "%";
      d.style.top = p.fy * 100 + "%";
      stage.appendChild(d);
    }
    $("undo").disabled = $("clear").disabled = points.length === 0;
  }

  let seq = 0;
  async function run() {
    drawPoints();
    if (!points.length) { maskImg.hidden = true; status.textContent = "Haz clic sobre un objeto."; return; }
    const my = ++seq;
    status.textContent = "Segmentando…";
    try {
      const r = await fetch("/segment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image_id: imageId, points: points.map(({ x, y, label }) => ({ x, y, label })) }),
      });
      if (!r.ok) throw new Error((await r.json()).detail);
      const d = await r.json();
      if (my !== seq) return; // descarta respuestas viejas
      maskImg.src = d.mask_png;
      maskImg.hidden = false;
      status.textContent = `Score IoU: ${d.score} · Área: ${d.area_pct}% · ${d.seconds}s`;
    } catch (err) {
      if (my === seq) status.textContent = "Error: " + err.message;
    }
  }

  function reset() { imageId = null; points = []; }
</script>
</body>
</html>
